stages:
  - init
  - test
  - build
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH =~ $TEST_TRIGGER_BY_CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ $TEST_TRIGGER_BY_CI_COMMIT_TAG

include:
  - local: /ci/provider/gitlab/config/100-variables.yaml
  - local: /ci/provider/gitlab/config/110-variables-backend.yaml
  - local: /ci/provider/gitlab/config/120-variables-frontend.yaml
  - local: /ci/provider/gitlab/config/130-variables-gitlab.yaml
  - local: /ci/provider/gitlab/config/200-default.yaml
  - local: /ci/provider/gitlab/config/300-init.yaml
  - local: /ci/provider/gitlab/config/400-test-backend.yaml
  - local: /ci/provider/gitlab/config/410-test-frontend.yaml
  - local: /ci/provider/gitlab/config/500-build-backend.yaml
  - local: /ci/provider/gitlab/config/510-build-frontend.yaml
  - local: /ci/provider/gitlab/config/600-deploy.yaml