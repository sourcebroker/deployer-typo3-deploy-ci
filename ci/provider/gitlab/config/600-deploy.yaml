.deploy_before_script_start:
  script: []

.deploy_before_script_end:
  script: []

.deploy_script_start:
  script: []

.deploy_script_end:
  script: []

.deploy_rsync_install:
  script:
    - |
      if [ -z "$DEPLOY_RSYNC_SKIP" ] && ! command -v rsync > /dev/null 2>&1; then
        if command -v apk > /dev/null 2>&1; then
          apk add rsync --update
        elif command -v apt-get > /dev/null 2>&1; then
          apt-get update && apt-get install -y rsync
        elif command -v dnf > /dev/null 2>&1; then
          dnf install -y rsync
        elif command -v yum > /dev/null 2>&1; then
          yum install -y rsync
        fi
      fi

.deploy_ssh_setup:
  script:
    - eval $(ssh-agent -s)
    # SSH_PRIVATE_KEY must be base64 encoded before added to gitlab variable as 'mask variable': "cat privatekey | base64 -w0" (on mac "cat privatekey | base64 -b0")
    - echo -e "$SSH_PRIVATE_KEY" | base64 -d | ssh-add - > /dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile /dev/null" >> ~/.ssh/config

.deploy_script_deployer_selector:
  script:
    - |
      if [ -z "$DEPLOYER_SELECTOR" ]; then
        if [ -n "$CI_COMMIT_TAG" ]; then
          export DEPLOYER_SELECTOR="$DEPLOYER_SELECTOR_FOR_TAG"
          export DEPLOYER_BT="--tag=${CI_COMMIT_TAG}"
        else
          IFS=',' read -ra MAPPINGS <<< "$DEPLOYER_SELECTOR_FOR_BRANCH"
          for mapping in "${MAPPINGS[@]}"; do
            IFS=':' read -ra PAIR <<< "$mapping"
            if [ "${PAIR[0]}" == "$CI_COMMIT_BRANCH" ]; then
              export DEPLOYER_SELECTOR="${PAIR[1]}"
              export DEPLOYER_BT="--branch=${CI_COMMIT_BRANCH}"
              break
            fi
          done
        fi
      fi

.deploy_script_run:
  script:
    - |
      if [ -z "$DEPLOYER_SELECTOR" ]; then
        echo "DEPLOYER_SELECTOR is empty. Exiting job." >&2
        exit 0
      fi
      echo "DEPLOYER_SELECTOR: $DEPLOYER_SELECTOR"
      cd ${CI_BUILDS_DIR} && mkdir -p deployer && cd deployer && composer require ${DEPLOYER_INSTALL:-deployer/deployer:^7.5} --verbose --prefer-dist --no-progress --no-interaction --optimize-autoloader
      cd ${CI_PROJECT_DIR} && echo ${CI_COMMIT_SHA} > REVISION
      cd ${CI_PROJECT_DIR} && ${CI_BUILDS_DIR}/deployer/vendor/bin/dep ${DEPLOYER_DEPLOY_TASK:-deploy} ${DEPLOYER_BT} ${DEPLOYER_OPTIONS} ${DEPLOYER_SELECTOR} -vv

deploy:
  stage: deploy
  resource_group: "deploy"
  environment:
    name: $TARGET
    url: $TARGET_URL
    deployment_tier: $TARGET_TIER
  needs:
    - job: test-frontend
    - job: test-backend
    - job: build-frontend
    - job: build-backend
  before_script:
    - !reference [.deploy_before_script_start, script]
    - if [ -n "$DEPLOY_BEFORE_SCRIPT_START" ]; then eval "$DEPLOY_BEFORE_SCRIPT_START"; fi
    - !reference [.deploy_rsync_install, script]
    - !reference [.deploy_ssh_setup, script]
    - if [ -n "$DEPLOY_BEFORE_SCRIPT_END" ]; then eval "$DEPLOY_BEFORE_SCRIPT_END"; fi
    - !reference [.deploy_before_script_end, script]
  image:
    name: composer:latest
  cache: []
  variables:
    GIT_STRATEGY: none
  retry:
    max: 2
  script:
    - !reference [.deploy_script_start, script]
    - if [ -n "$DEPLOY_SCRIPT_START" ]; then eval "$DEPLOY_SCRIPT_START"; fi
    - !reference [.deploy_script_deployer_selector, script]
    - !reference [.deploy_script_run, script]
    - if [ -n "$DEPLOY_SCRIPT_END" ]; then eval "$DEPLOY_SCRIPT_END"; fi
    - !reference [.deploy_script_end, script]
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH =~ $DEPLOY_TRIGGER_BY_CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG && $CI_COMMIT_TAG =~ $DEPLOY_TRIGGER_BY_CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "trigger" && $ACTION == "deploy"
    - if: $CI_PIPELINE_SOURCE == "web" && $ACTION == "deploy"
    - if: $CI_PIPELINE_SOURCE == "api" && $ACTION == "deploy"